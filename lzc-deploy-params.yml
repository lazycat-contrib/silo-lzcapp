params:
  - id: root_user
    type: string
    name: "Root User"
    description: "Administrator username for the SILO console and S3 API"
    default_value: "admin"
    optional: false

  - id: root_password
    type: secret
    name: "Root Password"
    description: "Administrator password (at least 8 characters)"
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    root_user:
      name: "管理员用户名"
      description: "SILO 控制台与 S3 API 的管理员用户名"
    root_password:
      name: "管理员密码"
      description: "管理员密码（至少 8 位）"
