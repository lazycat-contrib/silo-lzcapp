version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/silo.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: silo

build:
  run_buildscript: false

images:
  # 上游 tag 族：RELEASE.YYYY-MM-DDTHH-MM-SSZ（正式）+ -distroless 变体 + 架构后缀
  # 只跟正式三段日期 tag，排除 distroless/架构别名；日期映射为 SemVer
  - id: silo
    target: service
    service: silo
    source: docker.io/pgsty/silo
    channel: date
    sort: semver
    tag_regex: '^RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$'
    version_regex: '^RELEASE\.(?P<version>[0-9]{4})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2})T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$'
    version_template: '{version}.{month}.{day}'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: SILO
    summary: "S3 兼容对象存储（MinIO 社区分支）"
