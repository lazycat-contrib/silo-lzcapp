application:
  subdomain: silo
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    # Web 控制台
    - location: /
      backend: http://silo:9001/
services:
  silo:
    # upstream: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    image: docker.1ms.run/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER={{ .U.root_user }}
      - MINIO_ROOT_PASSWORD={{ .U.root_password }}
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/silo:/data
    healthcheck:
      # SILO 镜像基于 redhat/ubi9 micro（无 curl/wget），用 bash 内置探测 9000 端口
      test:
        - CMD-SHELL
        - (echo > /dev/tcp/127.0.0.1/9000) 2> /dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
